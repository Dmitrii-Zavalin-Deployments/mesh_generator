name: 🧪 Dependency Capability Experiment (Minimal Step Path)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  validate-mesh-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Crucial for pythonOCC and FreeCAD: Ensures Conda environment variables and C++ links are active
        shell: bash -el {0} 

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          channels: conda-forge
          channel-priority: strict

      - name: 📦 Install Selected Stack (pythonOCC, NumPy, SciPy, FreeCAD, CGAL)
        run: |
          conda install -c conda-forge pythonocc-core numpy scipy freecad cgal gxx_linux-64 gmp

      - name: 🧪 Test S1 Capabilities (STEP Parsing Initiation)
        run: |
          python -c "
          from OCC.Core.STEPControl import STEPControl_Reader
          # Instantiate the reader to prove the library and C++ bindings are functional
          reader = STEPControl_Reader()
          print('✔ S1 Dependency (pythonOCC STEPControl_Reader): OK')
          "

      - name: 🧪 Test FreeCAD Reference Implementation (S1 Alternative / Reference)
        run: |
          python -c "
          import FreeCAD
          import Part
          # Test reading/generating a reference solid and extracting a bounding box via FreeCAD
          shape = Part.makeBox(10.0, 20.0, 30.0)
          bbox = shape.BoundBox
          print(f'✔ FreeCAD Kernel: OK | Reference BBox Extents: X({bbox.XMin}->{bbox.XMax}), Y({bbox.YMin}->{bbox.YMax}), Z({bbox.ZMin}->{bbox.ZMax})')
          "

      - name: 🧪 Test S2–S7 Capabilities (Bounding Box Extents)
        run: |
          python -c "
          from OCC.Core.Bnd import Bnd_Box
          from OCC.Core.BRepPrimAPI import BRepPrimAPI_MakeBox
          from OCC.Core.BRepBndLib import brepbndlib_Add
          
          # Simulate parsed geometry
          shape = BRepPrimAPI_MakeBox(10.0, 20.0, 30.0).Shape()
          
          # Test Bounding Box API
          box = Bnd_Box()
          brepbndlib_Add(shape, box)
          xmin, ymin, zmin, xmax, ymax, zmax = box.Get()
          
          print(f'✔ S2-S7 Dependency (pythonOCC Bnd_Box): OK | Extents: X({xmin}->{xmax}), Y({ymin}->{ymax}), Z({zmin}->{zmax})')
          "

      - name: 🧪 Test S8–S10 Capabilities (Grid Resolution Math)
        run: |
          python -c "
          import numpy as np
          from scipy import optimize
          
          # Simulate configuration and extents
          x_span = 10.0
          target_cell_size = 0.15
          
          # Test NumPy deterministic math
          nx = int(np.ceil(x_span / target_cell_size))
          
          print(f'✔ S8-S10 Dependency (NumPy / SciPy): OK | Computed nx: {nx}')
          "

      - name: 🧪 Test S11 Capabilities (Mask Generation Tools via pythonOCC)
        run: |
          python -c "
          import numpy as np
          from OCC.Core.BRepClass3d import BRepClass3d_SolidClassifier
          from OCC.Core.BRepPrimAPI import BRepPrimAPI_MakeBox
          from OCC.Core.gp import gp_Pnt
          
          # Create simulated solid and NumPy mask array
          shape = BRepPrimAPI_MakeBox(5.0, 5.0, 5.0).Shape()
          classifier = BRepClass3d_SolidClassifier(shape)
          mask_array = np.zeros((10, 10, 10), dtype=int)
          
          # Test Point-in-Solid classification
          test_point = gp_Pnt(2.5, 2.5, 2.5)
          classifier.Perform(test_point, 1e-6)
          
          print('✔ S11 Dependency (pythonOCC SolidClassifier & NumPy Arrays): OK')
          "

      - name: 🧪 Test CGAL Capabilities (S11 Alternative for Robust Voxelization & Primitives)
        run: |
          # Create a minimal test program to verify CGAL headers, kernels, and GMP linking are accessible
          cat << 'EOF' > test_cgal.cpp
          #include <CGAL/Simple_cartesian.h>
          #include <CGAL/Point_3.h>
          #include <iostream>

          typedef CGAL::Simple_cartesian<double> Kernel;
          typedef Kernel::Point_3 Point;

          int main() {
              Point p(2.5, 2.5, 2.5);
              std::cout << "✔ CGAL Core Kernel: OK | Spatial test point verified at (" << p.x() << ", " << p.y() << ", " << p.z() << ")" << std::endl;
              return 0;
          }
          EOF
          
          # Compile using Conda's environment-aware compiler flags
          g++ test_cgal.cpp -I$CONDA_PREFIX/include -L$CONDA_PREFIX/lib -lCGAL -lgmp -o test_cgal
          ./test_cgal

      - name: 🧪 Test S12 Capabilities (Boundary Condition Topo Traversal)
        run: |
          python -c "
          import numpy as np
          from OCC.Core.BRepPrimAPI import BRepPrimAPI_MakeBox
          from OCC.Core.TopExp import TopExp_Explorer
          from OCC.Core.TopAbs import TopAbs_FACE
          
          shape = BRepPrimAPI_MakeBox(1.0, 1.0, 1.0).Shape()
          
          # Test Topology traversal for faces
          explorer = TopExp_Explorer(shape, TopAbs_FACE)
          face_count = 0
          while explorer.More():
              face_count += 1
              explorer.Next()
              
          print(f'✔ S12 Dependency (pythonOCC TopExp_Explorer & NumPy Math): OK | Faces found: {face_count}')
          "

      - name: 🎉 Experiment Complete
        run: echo "✔ All required external and alternative dependencies for the Minimal Step Path are validated and functional."