name: Mesh Generator

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  # repository_dispatch:
  #   types: [artifact_driven_simulation_engine]

jobs:
  verification_tests:
    name: "📋 Verification Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        # Crucial for Conda: Ensures Conda environment variables and C++ links are active
        shell: bash -el {0}
    env:
      PYTHONPATH: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Define the 'Gold Standard' test command here (e.g. pytest -s tests/ -vv --cov=src --cov-report=term-missing)
      TEST_COMMAND: "pytest -s tests/ -vv --cov=src --cov-report=term-missing"
    
    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          # Normalize branch name for safe use in email (replace "/" with "-")
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"

          # Set dynamic robot identity per branch
          git config --global user.name "Automation Engine (${BRANCH_SAFE})"
          git config --global user.email "automation+${BRANCH_SAFE}@yourdomain"

          # Ensure Git Notes are rewritten and preserved
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          # Add 'defaults' here to match the channel usage in your requirements.sh
          channels: conda-forge,defaults
          channel-priority: strict

      - name: 📦 Provision Environment Layers (Conda + Pip)
        run: |
          chmod +x requirements.sh
          ./requirements.sh

      - name: 🌐 Install Headless Rendering Dependencies
        run: |
          # Establish virtual display device infrastructure and OpenGL bindings
          sudo apt-get update
          # libgl1 replaces the deprecated libgl1-mesa-glx on Ubuntu 24.04+
          sudo apt-get install -y libgl1 xvfb libglu1-mesa

      - name: 🧹 Auto-Clean (Autoflake)
        run: |
          autoflake --in-place --recursive --remove-unused-variables --remove-all-unused-imports src tests

      - name: 🧹 Static Analysis & Lint (Ruff)
        run: |
          ruff check src tests --fix

      - name: 🚀 Commit & Push Auto-Clean Changes
        if: always()
        run: |
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 robot: auto-clean structural hygiene"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1 Fetch remote notes FIRST
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2 Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3 Push commit
            git push origin HEAD || echo "Push skipped: branch protected."

            # 4 Force-push notes
            git push --force origin refs/notes/commits || true
          else
            echo "No hygiene changes detected."
          fi

      - name: 💀 Dead Code Audit (Vulture)
        run: |
          # Vulture exits with non-zero if dead code is found, triggering failure()
          vulture src --min-confidence 70

      - name: 🧪 Quality Gate Check
        if: failure()
        run: |
          echo "CRITICAL: Dead code detected in src/. Review the Vulture logs above."
          echo "Rule 2 (Zero-Debt Mandate) violation: Delete unused code before merging."
          exit 1
       
      - name: 🧪 Run Logic & Scientific Verification
        run: |
          echo "🚀 Initiating: $TEST_COMMAND inside virtual frame buffer"
          xvfb-run --auto-servernum $TEST_COMMAND
      
      - name: 🔍 Forensic Audit
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ All systems nominal. No anomalies detected in solver lifecycle."
            cat <<EOF > debug/forensic_audit_verification.sh
          #!/bin/bash
          # Description: Automated forensic audit for Navier-Stokes solver failures.
          # Status: Dormant (All systems nominal)
          exit 0
          EOF
            chmod +x debug/forensic_audit_verification.sh
            echo "🧹 Diagnostic script has been reset to Dormant mode."
          else
            echo "⚠️ CI Failure Detected. Initiating Deep Forensic Audit..."
            echo "============================================================"
            echo "ls -R output:"
            ls -R || echo "output dir not found"
            echo "============================================================"
            echo "debug/forensic_audit_verification.sh run results:"
            if [ -f "debug/forensic_audit_verification.sh" ]; then
              bash debug/forensic_audit_verification.sh
            else
              echo "❌ Critical: Diagnostic script 'debug/forensic_audit_verification.sh' not found."
            fi
            echo "============================================================"
            echo "📉 RE-RUNNING FAILED TEST FOR FINAL SIGNAL"
            xvfb-run --auto-servernum $TEST_COMMAND || true
            exit 1
          fi
      
      - name: 🧹 Sync Forensic Reset
        # This only runs if the '🔍 Forensic Audit' step and tests passed
        if: success()
        run: |
          git add debug/forensic_audit_verification.sh
          if [ -n "$(git status --porcelain debug/forensic_audit_verification.sh)" ]; then
            git commit -m "🤖 robot: forensic reset [PASS]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1 Fetch remote notes FIRST
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2 Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3 Push commit
            git push origin HEAD || echo "Push skipped: concurrent push detected."

            # 4 Force-push notes
            git push --force origin refs/notes/commits || true
          else
            echo "Forensic script already dormant."
          fi

  validation_tests:
    name: "🔬 Validation Tests"
    needs: verification_tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # Crucial for Conda: Ensures Conda environment variables and C++ links are active
        shell: bash -el {0}
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          # Normalize branch name for safe use in email (replace "/" with "-")
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"

          # Set dynamic robot identity per branch
          git config --global user.name "Automation Engine (${BRANCH_SAFE})"
          git config --global user.email "automation+${BRANCH_SAFE}@yourdomain"

          # Ensure Git Notes are rewritten and preserved
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          # Add 'defaults' here to match the channel usage in your requirements.sh
          channels: conda-forge,defaults
          channel-priority: strict

      - name: 📦 Provision Environment Layers (Conda + Pip)
        run: |
          chmod +x requirements.sh
          ./requirements.sh

      - name: 🌐 Install Headless Rendering Dependencies
        run: |
          # Establish virtual display device infrastructure and OpenGL bindings
          sudo apt-get update
          # libgl1 replaces the deprecated libgl1-mesa-glx on Ubuntu 24.04+
          sudo apt-get install -y libgl1 xvfb libglu1-mesa

      - name: 🚀 Execute Mesh Generator Engine
        run: |
          # Run execution module targeted inside a virtual display frame server allocation loop
          xvfb-run --auto-servernum python src/main.py --input_output_folder "${GITHUB_WORKSPACE}/data/testing-input-output/"

      - name: 🔍 Post-Execution Artifact Verification
        run: |
          # Verify that JSON output data has been deterministically compiled
          echo "--- Verifying Generated Output Structure ---"
          ls -l data/testing-input-output/mesh_generator_output.json
          
          # Verify that the universal png asset file has been successfully dumped
          echo "--- Verifying Universal Mesh Snapshot Asset ---"
          ls -l data/testing-input-output/mesh_snapshot.png
          
          # Print output summary for logs tracing
          head -n 30 data/testing-input-output/mesh_generator_output.json

      - name: 💾 Sync Testing Assets to Repository
        if: always()
        run: |
          # 1. Stash local changes (including untracked files)
          git stash -u

          # 2. Pull with '-X ours' to resolve binary conflicts by favoring our new snapshot
          # This forces Git to accept our locally generated PNG if it conflicts with the remote
          git pull origin HEAD --rebase -X ours

          # 3. Restore stashed changes
          git stash pop || true

          # 4. Add the specific test folder
          git add data/testing-input-output/

          # 5. Commit/Push
          if [ -n "$(git status --porcelain data/testing-input-output/)" ]; then
            git commit -m "🤖 robot: sync testing assets [${{ job.status }}]"
            git push origin HEAD
          else
            echo "No testing asset changes detected. Sync skipped."
          fi

      - name: 📊 Audit Performance Ledger & Sync
        if: always()
        run: |
          # ⚠️ WARNING: git reset/clean deletes non-tracked files. 
          # Ensure your simulation artifacts are already saved/uploaded before this step!
          git reset --hard HEAD
          git clean -ffdx
          git pull origin HEAD --rebase

          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          STATUS="${{ job.status }}"
          CURRENT_BRANCH=${GITHUB_REF##*/}
          CPU_LOAD=$(top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4 "%"}')
          MEM_USAGE=$(free -m | awk '/Mem:/ { print $3 "/" $2 "MB" }')

          # New log entry
          NEW_ENTRY=$(cat <<EOF
          ### Audit: $RUN_DATE
          - **Branch:** \`$CURRENT_BRANCH\`
          - **Status:** $STATUS
          - **CPU Load:** $CPU_LOAD
          - **Memory Usage:** $MEM_USAGE
          ---
          EOF
          )

          HEADER="# 📐 Mesh Generator Performance Audit"
          TUTORIAL="### 📚 Resources & Documentation
          - **Tutorial/Book:** <currently in development>
          ---"

          if [ -f "README.md" ]; then
              # Extract everything after the first horizontal rule to preserve the body
              sed '1,/---/d' README.md > old_body.tmp
              echo "$HEADER" > README.md
              echo "$TUTORIAL" >> README.md
              echo "$NEW_ENTRY" >> README.md
              cat old_body.tmp >> README.md
              rm old_body.tmp
          else
              # Initialize new README
              echo "$HEADER" > README.md
              echo "$TUTORIAL" >> README.md
              echo "$NEW_ENTRY" >> README.md
          fi

          git add README.md

          if [ -n "$(git status --porcelain README.md)" ]; then
            git commit -m "🤖 robot: audit ledger update [${{ job.status }}] [skip ci]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1 Fetch remote notes
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2 Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3 Push commit and notes
            git pull origin HEAD --rebase || echo "Rebase failed, pushing without rebase."
            git push origin HEAD
            git push --force origin refs/notes/commits || true
          else
            echo "No ledger changes."
          fi
          
      - name: 🔍 Forensic Audit
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ All systems nominal. No anomalies detected in solver lifecycle."
            cat <<EOF > debug/forensic_audit_validation.sh
          #!/bin/bash
          # Description: Automated forensic audit for Navier-Stokes solver failures.
          # Status: Dormant (All systems nominal)
          exit 0
          EOF
            chmod +x debug/forensic_audit_validation.sh
            echo "🧹 Diagnostic script has been reset to Dormant mode."
          else
            echo "⚠️ CI Failure Detected. Initiating Deep Forensic Audit..."
            echo "============================================================"
            echo "ls -R output:"
            ls -R || echo "output dir not found"
            echo "============================================================"
            echo "debug/forensic_audit_validation.sh run results:"
            if [ -f "debug/forensic_audit_validation.sh" ]; then
              bash debug/forensic_audit_validation.sh
            else
              echo "❌ Critical: Diagnostic script 'debug/forensic_audit_validation.sh' not found."
            fi
            exit 1
          fi
      
      - name: 🧹 Sync Forensic Reset
        # This only runs if the '🔍 Forensic Audit' step and tests passed
        if: success()
        run: |
          git add debug/forensic_audit_validation.sh
          if [ -n "$(git status --porcelain debug/forensic_audit_validation.sh)" ]; then
            git commit -m "🤖 robot: forensic reset [PASS]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1 Fetch remote notes FIRST
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2 Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3 Push commit
            git push origin HEAD || echo "Push skipped: concurrent push detected."

            # 4 Force-push notes
            git push --force origin refs/notes/commits || true
          else
            echo "Forensic script already dormant."
          fi